name: Telegram alert
description: Post a message to the Greatwhale & Automation Alerts topic
inputs:
  text:
    required: true
  bot-token:
    required: true
  chat-id:
    required: true
  topic-id:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.bot-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat-id }}
        TELEGRAM_TOPIC_ID: ${{ inputs.topic-id }}
        TEXT: ${{ inputs.text }}
      run: |
        curl --fail --silent --show-error --output /dev/null --retry 3 --retry-all-errors \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "message_thread_id=${TELEGRAM_TOPIC_ID}" \
          --data-urlencode "text=${TEXT}"
