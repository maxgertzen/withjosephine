name: Setup
description: Install pnpm, Node, restore caches, and install dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 10

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Cache node_modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-pnpm10-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install studio dependencies
      shell: bash
      run: pnpm --dir studio install --frozen-lockfile
