name: security-scan

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Only send a test message to Telegram, skip the scan
        type: boolean
        default: false

jobs:
  osv-scan:
    if: ${{ !inputs.telegram_test }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
        --lockfile=./studio/pnpm-lock.yaml
        --config=./osv-scanner.toml

  report:
    needs: osv-scan
    if: ${{ always() && !inputs.telegram_test }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SCAN_RESULT: ${{ needs.osv-scan.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ASSIGNEE: ${{ github.repository_owner }}
    steps:
      - name: Open, update or close the security-scan issue
        run: |
          open_issue=$(gh issue list --label security-scan --state open --json number --jq '.[0].number // empty')
          if [ "$SCAN_RESULT" != "success" ]; then
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --body "The security scan failed again: $RUN_URL"
            else
              gh label create security-scan --color B60205 --description "Weekly OSV scan failed" --force
              gh issue create \
                --title "Weekly security scan failed" \
                --label security-scan \
                --assignee "$ASSIGNEE" \
                --body "The run log lists the vulnerable packages with their fixed versions, or the error that stopped the scan: $RUN_URL"
            fi
          elif [ "$SCAN_RESULT" = "success" ] && [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "The security scan passed: $RUN_URL"
          fi

  telegram:
    needs: osv-scan
    if: ${{ always() && (needs.osv-scan.result != 'success' || inputs.telegram_test) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/telegram-alert
        with:
          text: "${{ inputs.telegram_test && 'Test message from the withjosephine security scan' || 'The withjosephine weekly security scan failed' }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic-id: ${{ secrets.TELEGRAM_TOPIC_ID }}
